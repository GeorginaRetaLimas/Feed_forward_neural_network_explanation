// 6 — ¿Qué es una FNN?
{title:'¿Qué es una FNN?',chapter:'Fundamentos',render:function(){return ''
  +'<h2>¿Qué es una <span class="accent">Feedforward Neural Network</span>?</h2>'
  +'<p class="lead">Una red neuronal donde la información viaja <strong>en una sola dirección</strong>: entrada → capas ocultas → salida, sin ciclos ni memoria.</p>'
  +note('Analogía: una <strong>línea de ensamblaje</strong>. Una pieza pasa por estaciones en orden, cada una la transforma un poco, y nunca regresa a la anterior. Al final sale el producto: la predicción.')
  +tip('<strong>Ejemplo real:</strong> un banco recibe ingresos, historial crediticio y gastos de una persona, y la red devuelve un puntaje de riesgo crediticio.')
  +'<p style="font-size:14px;color:var(--muted)">Se usa para <strong>clasificación</strong> y <strong>regresión</strong> sobre datos de tamaño fijo. '+extLink(gfg,'Fuente: GeeksforGeeks')+'</p>';
}},

// 7 — Arquitectura
{title:'Arquitectura: 3 capas',chapter:'Fundamentos',render:function(){return ''
  +'<h2>Las <span class="accent">tres capas</span> de una FNN</h2>'
  +'<div class="parts" style="grid-template-columns:repeat(3,1fr)">'
    +'<div><h4>Entrada</h4><span class="part-label">Input Layer</span><p>Una neurona por cada característica del dato (ej. 4 medidas de una flor).</p></div>'
    +'<div><h4>Ocultas</h4><span class="part-label">Hidden Layers</span><p>Aprenden patrones complejos combinando entradas con pesos y activaciones.</p></div>'
    +'<div class="crew-part"><h4>Salida</h4><span class="part-label">Output Layer</span><p>Una neurona por clase (clasificación) o por valor a predecir (regresión).</p></div>'
  +'</div>'
  +note('Cada conexión entre neuronas tiene un <strong>peso</strong>, y ajustar esos pesos durante el entrenamiento es literalmente “aprender”.')
  +'<div class="slide-end"><p class="takeaway">Analogía: un comité de evaluación — los datos son el expediente, las capas ocultas son evaluadores intermedios, y la salida es el veredicto final.</p></div>';
}},

// 8 — La neurona
{title:'¿Qué hace una neurona?',chapter:'Fundamentos',render:function(){return ''
  +'<h2>Dentro de <span class="accent">una neurona</span></h2>'
  +'<p class="lead">Cada neurona calcula una suma ponderada más un sesgo, y le aplica una función de activación.</p>'
  +codeBlock('z = w1*x1 + w2*x2 + w3*x3 + b\na = f(z)')
  +note('Analogía: decidir si <strong>salir a correr</strong>. Consideras el clima, tu energía y tu tiempo libre — cada factor pesa distinto (pesos). Tu “umbral personal” es el sesgo (bias). Si la suma supera el umbral, sales a correr (la neurona se activa).')
  +tip('<strong>Ejemplo:</strong> predecir si un estudiante aprueba según horas de estudio y asistencia. Si tras aplicar la activación la salida es <code>0.85</code>, el modelo dice 85% de probabilidad de que apruebe.');
}},

// 9 — Funciones de activación
{title:'Funciones de activación',chapter:'Fundamentos',render:function(){return ''
  +'<h2>Funciones de <span class="accent">activación</span></h2>'
  +'<p class="lead">Sin ellas, por muchas capas que tuviera, la red solo podría aprender relaciones lineales.</p>'
  +'<table>'
    +'<tr><td><strong>ReLU</strong></td><td><code>max(0, z)</code></td><td>La más usada en capas ocultas — simple y rápida.</td></tr>'
    +'<tr><td><strong>Sigmoid</strong></td><td><code>1 / (1 + e⁻ᶻ)</code></td><td>Comprime entre 0 y 1 — clasificación binaria.</td></tr>'
    +'<tr><td><strong>Tanh</strong></td><td><code>(eᶻ−e⁻ᶻ)/(eᶻ+e⁻ᶻ)</code></td><td>Parecida a sigmoid, entre -1 y 1.</td></tr>'
    +'<tr><td><strong>Softmax</strong></td><td>normaliza a probabilidades</td><td>En la salida multiclase: valores que suman 1.</td></tr>'
  +'</table>'
  +note('Analogía: ReLU es una válvula que solo deja pasar lo positivo; sigmoid es como una perilla de volumen entre 0% y 100%.');
}},

// 10 — Forward propagation y pérdida
{title:'Forward propagation y pérdida',chapter:'Fundamentos',render:function(){return ''
  +'<h2>Propagación hacia adelante y <span class="accent">función de pérdida</span></h2>'
  +'<h4>Forward propagation</h4>'
  +'<p>Los datos entran y cada capa pasa su salida a la siguiente: <code>X → H1 → H2 → Y</code>. Al predecir en producción, <strong>solo se hace este paso</strong>.</p>'
  +'<h4>Función de pérdida</h4>'
  +'<p>Compara la predicción con la respuesta real y da un número: el error. Para regresión se suele usar el error cuadrático medio (MSE); para clasificación, entropía cruzada.</p>'
  +note('Analogía: la pérdida es como un <strong>examen</strong> — mide cuántas respuestas salieron mal. El objetivo del entrenamiento es sacar la mejor calificación posible.');
}},

// 11 — Backpropagation
{title:'Backpropagation',chapter:'Fundamentos',render:function(){return ''
  +'<h2><span class="accent">Backpropagation</span> y descenso por gradiente</h2>'
  +'<p class="lead">La red calcula cuánto contribuyó cada peso al error (yendo de atrás hacia adelante) y los ajusta un poco:</p>'
  +codeBlock('w_nuevo = w_viejo - η * (∂L/∂w)')
  +'<p><code>η</code> (eta) es la <strong>tasa de aprendizaje</strong>: el tamaño del paso.</p>'
  +note('Analogía: bajar una <strong>montaña con niebla</strong>. No ves el valle, pero sientes hacia dónde baja el terreno. Das un paso en esa dirección y repites. Pasos muy grandes te hacen pasar de largo; pasos muy chicos tardan una eternidad.');
}},

// 12 — Ciclo de entrenamiento
{title:'Entrenamiento y evaluación',chapter:'Fundamentos',render:function(){return ''
  +'<h2>El ciclo de <span class="accent">entrenamiento</span></h2>'
  +'<p class="lead">Se repite en muchos lotes (batches) y épocas:</p>'
  +codeBlock('forward → calcular pérdida → backpropagation → actualizar pesos')
  +'<h4>Evaluación en datos nunca vistos (test)</h4>'
  +'<p>Accuracy, Precision, Recall, F1 Score y Matriz de Confusión.</p>'
  +warn('<strong>Sobreajuste (overfitting):</strong> si la red memoriza los datos de entrenamiento pero falla con datos nuevos, es como un estudiante que memoriza las respuestas del examen de práctica sin entender la materia.');
}},

// 16 — Código completo
{title:'El código completo',chapter:'El taller',render:function(){return ''
  +'<h2>Código de <span class="accent">train_iris.py</span></h2>'
  +'<p class="lead">Pega este contenido completo en el archivo:</p>'
  +codeBlock(
    'import numpy as np\n'
   +'from sklearn.datasets import load_iris\n'
   +'from sklearn.model_selection import train_test_split\n'
   +'from sklearn.preprocessing import StandardScaler\n'
   +'from sklearn.metrics import classification_report\n'
   +'import tensorflow as tf\n'
   +'from tensorflow import keras\n'
   +'from tensorflow.keras import layers\n'
   +'\n'
   +'# 1. Cargar datos\n'
   +'iris = load_iris()\n'
   +'X, y = iris.data, iris.target\n'
   +'nombres = iris.target_names\n'
   +'\n'
   +'# 2. Dividir y normalizar\n'
   +'X_train, X_test, y_train, y_test = train_test_split(\n'
   +'    X, y, test_size=0.2, stratify=y, random_state=42)\n'
   +'scaler = StandardScaler()\n'
   +'X_train = scaler.fit_transform(X_train)\n'
   +'X_test = scaler.transform(X_test)\n'
   +'\n'
   +'# 3. Construir la red\n'
   +'model = keras.Sequential([\n'
   +'    keras.Input(shape=(4,)),\n'
   +'    layers.Dense(16, activation="relu"),\n'
   +'    layers.Dense(8, activation="relu"),\n'
   +'    layers.Dense(3, activation="softmax"),\n'
   +'])\n'
   +'\n'
   +'# 4. Compilar\n'
   +'model.compile(optimizer="adam",\n'
   +'              loss="sparse_categorical_crossentropy",\n'
   +'              metrics=["accuracy"])\n'
   +'\n'
   +'# 5. Entrenar\n'
   +'model.fit(X_train, y_train, epochs=100, batch_size=16,\n'
   +'          validation_split=0.2, verbose=0)\n'
   +'\n'
   +'# 6. Evaluar\n'
   +'test_loss, test_acc = model.evaluate(X_test, y_test, verbose=0)\n'
   +'print(f"Precisión en test: {test_acc:.3f}")\n'
   +'y_pred = np.argmax(model.predict(X_test, verbose=0), axis=1)\n'
   +'print(classification_report(y_test, y_pred, target_names=nombres))\n'
   +'\n'
   +'# 7. Predecir una flor nueva\n'
   +'flor = np.array([[5.1, 3.5, 1.4, 0.2]])\n'
   +'probs = model.predict(scaler.transform(flor), verbose=0)[0]\n'
   +'print("Predicción:", nombres[np.argmax(probs)])'
  ,'train_iris.py')
  +tip('Este es el núcleo funcional del script. La versión extendida con gráficas (curva de pérdida y matriz de confusión) está en los archivos <code>.md</code> del taller.');
}},

];} /* end makeSlides */
/* === Taller FNN + Iris — Navegación y lógica === */
const iconArrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
/* === Modo claro / oscuro === */
const sunPath='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
const moonPath='<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>';
function currentTheme(){
  var attr=document.documentElement.getAttribute('data-theme');
  if(attr==='light'||attr==='dark')return attr;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function updateThemeIcon(t){
  var icon=document.getElementById('theme-icon');
  var btn=document.getElementById('theme-toggle');
  if(!icon||!btn)return;
  icon.innerHTML=t==='dark'?moonPath:sunPath;
  btn.setAttribute('aria-label',t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro');
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('fnn-theme',t)}catch(e){}
  updateThemeIcon(t);
}
function toggleTheme(){applyTheme(currentTheme()==='dark'?'light':'dark')}
updateThemeIcon(currentTheme());
document.getElementById('theme-toggle').addEventListener('click',toggleTheme);

const iconCopy='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

/* Portada (slide 0) */
const slides=[{
  title:'Tu primera red neuronal feedforward',
  chapter:'Inicio',
  render:()=>'<div class="hero">'
    +'<h1>Taller FNN<span class="accent">.</span></h1>'
    +'<p class="hero-sub">Clasifica flores <span class="accent">Iris</span> con una red neuronal construida desde cero.</p>'
    +'<p class="lead">Guía paso a paso: teoría de la Feedforward Neural Network, instalación y código con TensorFlow/Keras.</p>'
    +'<button class="start-btn" data-next>Comenzar '+iconArrow+'</button>'
    +'<p class="hero-meta">Taller práctico · ~45–60 min · Windows / Linux / macOS</p>'
    +'</div>'
}];

slides.push(...makeSlides());

let current=0;let indexOpen=false;
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');

function navigate(n,updateHash){
  if(updateHash===undefined)updateHash=true;
  current=Math.min(Math.max(Number.isFinite(n)?Math.trunc(n):0,0),slides.length-1);
  var s=slides[current];
  stage.innerHTML='<section class="slide" aria-label="'+(current+1)+'. '+s.title+'">'+s.render()+'</section>';
  stage.scrollTop=0;
  document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';
  document.getElementById('chapter').textContent=s.chapter;
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===slides.length-1;
  document.title=(current+1)+'. '+s.title+' — Taller FNN';
  document.getElementById('announcement').textContent='Diapositiva '+(current+1)+' de '+slides.length+': '+s.title;
  if(updateHash)history.replaceState(null,'','#'+(current+1));
  renderIndex();
}

function renderIndex(){
  var html='';
  for(var i=0;i<slides.length;i++){
    html+='<button class="index-item" data-slide="'+i+'"'+(i===current?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+slides[i].title+'</button>';
  }
  document.getElementById('index-items').innerHTML=html;
}

function toggleIndex(force){
  indexOpen=force!==undefined?force:!indexOpen;
  document.getElementById('slide-index').hidden=!indexOpen;
  document.getElementById('index-toggle').setAttribute('aria-expanded',String(indexOpen));
  stage.inert=indexOpen;
  if(indexOpen)document.getElementById('close-index').focus();
  else document.getElementById('index-toggle').focus();
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},4000);
}

function toggleFullscreen(){
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
    else toast('Usa F11 para pantalla completa.');
  }catch(e){toast('No se pudo activar pantalla completa.');}
}

/* Copy code to clipboard */
function copyCode(btn){
  var code=btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function(){
    btn.classList.add('copied');
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7" stroke-width="2"/></svg>';
    setTimeout(function(){
      btn.classList.remove('copied');
      btn.innerHTML=iconCopy;
    },2000);
  }).catch(function(){toast('No se pudo copiar. Selecciona el texto manualmente.');});
}

/* Event listeners */
prevBtn.addEventListener('click',function(){navigate(current-1)});
nextBtn.addEventListener('click',function(){navigate(current+1)});
document.getElementById('index-toggle').addEventListener('click',function(){toggleIndex()});
document.getElementById('close-index').addEventListener('click',function(){toggleIndex(false)});
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-next],[data-slide]');
  if(b){
    if(b.hasAttribute('data-next'))navigate(current+1);
    else{navigate(Number(b.dataset.slide));toggleIndex(false);}
    return;
  }
  var copyBtn=e.target.closest('.copy-btn');
  if(copyBtn){copyCode(copyBtn);return;}
  /* Tabs */
  var tabBtn=e.target.closest('.tab-btn');
  if(tabBtn){
    var group=tabBtn.closest('.tab-group');
    var btns=group.querySelectorAll('.tab-btn');
    var panels=group.querySelectorAll('.tab-panel');
    for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
    for(var j=0;j<panels.length;j++)panels[j].classList.remove('active');
    tabBtn.classList.add('active');
    document.getElementById(tabBtn.dataset.tab).classList.add('active');
  }
});

document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'&&indexOpen){toggleIndex(false);return}
  if(e.key.toLowerCase()==='i'){e.preventDefault();toggleIndex();return}
  if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen();return}
  if(e.key.toLowerCase()==='t'){e.preventDefault();toggleTheme();return}
  if(indexOpen)return;
  if(e.target.closest('button,a')&&[' ','Enter'].indexOf(e.key)!==-1)return;
  if(['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key)!==-1){e.preventDefault();navigate(current+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)!==-1){e.preventDefault();navigate(current-1)}
  if(e.key==='Home'){e.preventDefault();navigate(0)}
  if(e.key==='End'){e.preventDefault();navigate(slides.length-1)}
});

window.addEventListener('hashchange',function(){navigate((Number(location.hash.slice(1))||1)-1,false)});
document.addEventListener('fullscreenchange',function(){
  document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa');
});

var touchStart=null;
stage.addEventListener('touchstart',function(e){touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
stage.addEventListener('touchend',function(e){
  if(!touchStart||e.target.closest('button,a,pre,details'))return;
  var dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)navigate(current+(dx<0?1:-1));
  touchStart=null;
},{passive:true});

navigate((Number(location.hash.slice(1))||1)-1);
</script>
